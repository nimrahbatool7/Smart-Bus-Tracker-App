name: smart_bus_tracking_app
description: "A smart bus tracking and ticketing platform for passengers, drivers, and admins."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.4

  # State management & navigation
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.3.0

  # UI & animations
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8

  # Maps & charts
  google_maps_flutter: ^2.17.1
  fl_chart: ^1.2.0

  # QR scanning (real camera)
  mobile_scanner: ^6.0.2

  # Location / GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Secure local storage
  flutter_secure_storage: ^9.2.4

  # Environment configuration
  flutter_dotenv: ^5.2.1

  # Image picking for profile photo / driver documents
  image_picker: ^1.1.2

  # QR code display (passenger pass screen)
  qr_flutter: ^4.1.0

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - .env
